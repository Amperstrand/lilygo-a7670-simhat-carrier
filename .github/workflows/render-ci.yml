name: Render Pipeline
on:
  push:
    branches: [cad/combined-carrier-v1]
  pull_request:
    branches: [cad/combined-carrier-v1]

jobs:
  build-renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (frozen, matches the local .venv)
        run: |
          pip install --quiet -r requirements-frozen.txt

      - name: Build carrier and generate renders
        env:
          # OCP/OpenCascade segfaults (exit 139) on CI runners when its
          # thread pool races under constrained CPUs — pin to one thread
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/build.py

      - name: Verify renders directory is present
        run: |
          n=$(ls renders/ | wc -l)
          echo "renders: $n files"
          [ "$n" -ge 20 ] && echo "OK" || { echo "unexpected render count"; exit 1; }
