name: Render Pipeline
on:
  push:
    branches: [cad/combined-carrier-v1]
  pull_request:
    branches: [cad/combined-carrier-v1]

jobs:
  build-renders:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (frozen, matches the local .venv)
        run: |
          pip install --quiet -r requirements-frozen.txt

      # VTK offscreen rendering needs a GL stack; the runner has none
      # (X -> EGL -> OSMesa all missing => segfault, exit 139)
      - name: Install headless GL for VTK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libegl1 libgl1 libosmesa6 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Build carrier and generate renders
        env:
          # OCP/OpenCascade segfaults (exit 139) on CI runners when its
          # thread pool races under constrained CPUs — pin to one thread
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/build.py
          python tools/photobake.py
          python scripts/audit_photobake.py

      - name: Verify renders directory is present
        run: |
          n=$(ls renders/ | wc -l)
          echo "renders: $n files"
          [ "$n" -ge 16 ] && echo "OK" || { echo "unexpected render count"; exit 1; }

      # renders/ is generated, not tracked (B5): every push to the working
      # branch force-deploys the fresh set to gh-pages, served by Pages at
      # https://amperstrand.github.io/lilygo-a7670-simhat-carrier/<file>.png
      - name: Deploy renders to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/cad/combined-carrier-v1'
        run: |
          cd renders
          git init -q -b gh-pages .
          git config user.name "render-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "renders @ ${GITHUB_SHA}"
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin gh-pages
